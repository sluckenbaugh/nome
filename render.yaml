services:
  - type: web
    name: nome
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # Single-page app: serve index.html for any path (e.g. /guide) so refreshes and direct links work.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
